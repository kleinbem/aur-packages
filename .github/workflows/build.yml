name: build

# Builds every package whose directory changed (or the one asked for) with the
# same `just build` as on the workstation: a fresh archlinux:base-devel
# container, makepkg as an unprivileged user, then namcap. Also checks that
# .SRCINFO matches the PKGBUILD.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pkg:
        description: Package directory to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          PKG: ${{ inputs.pkg }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            dirs="$PKG"
          elif [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            dirs=$(git ls-files '*/PKGBUILD' | xargs -r -n1 dirname)
          else
            dirs=$(git diff --name-only "$BASE" HEAD | cut -d/ -f1 | sort -u)
          fi
          list=$(for d in $dirs; do if [ -f "$d/PKGBUILD" ]; then echo "$d"; fi; done | jq -Rnc '[inputs | select(length > 0)]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "packages: $list"

  build:
    needs: packages
    if: needs.packages.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Rust, llama.cpp and GPU SDKs need more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install just
        run: sudo apt-get install -y --no-install-recommends just
      - name: .SRCINFO is current
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          just srcinfo "$PKG"
          git diff --exit-code -- "$PKG/.SRCINFO" || { echo "::error::regenerate $PKG/.SRCINFO (just srcinfo $PKG)"; exit 1; }
      - name: Build
        env:
          PKG: ${{ matrix.pkg }}
        run: just build "$PKG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.pkg }}
          path: out/${{ matrix.pkg }}/
          if-no-files-found: error
