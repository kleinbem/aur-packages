name: build

# Builds every package whose directory changed (or the one asked for) with the
# same `just build` as on the workstation: a fresh archlinux:base-devel
# container, makepkg as an unprivileged user, then namcap. Also checks that
# .SRCINFO matches the PKGBUILD.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pkg:
        description: Package directory to build
        required: true
        type: string

permissions:
  contents: read

# A newer PR push supersedes the old build; every main push gets its own group,
# as a shared one keeps only the newest pending run.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          PKG: ${{ inputs.pkg }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all=$(git ls-files '*/PKGBUILD' | xargs -r -n1 dirname)
          if [ "$EVENT" = workflow_dispatch ]; then
            dirs="$PKG"
          elif [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            dirs=$all
          # A force-push can leave BASE outside the history: build everything.
          elif ! changed=$(git diff --name-only "$BASE" HEAD); then
            dirs=$all
          # The shared build scripts affect every package.
          elif grep -qE '^(scripts/|justfile$)' <<<"$changed"; then
            dirs=$all
          else
            dirs=$(cut -d/ -f1 <<<"$changed" | sort -u)
          fi
          list=$(for d in $dirs; do if [ -f "$d/PKGBUILD" ]; then echo "$d"; fi; done | jq -Rnc '[inputs | select(length > 0)]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "packages: $list"

  build:
    needs: packages
    if: needs.packages.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust, llama.cpp and GPU SDKs need more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # From just's GitHub releases: the runners' Ubuntu mirror often fails
      # to resolve (azure.archive.ubuntu.com).
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: .SRCINFO is current
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          just srcinfo "$PKG"
          # --porcelain also catches a .SRCINFO that was never committed.
          if [ -n "$(git status --porcelain -- "$PKG/.SRCINFO")" ]; then
            echo "::error::regenerate $PKG/.SRCINFO (just srcinfo $PKG)"
            exit 1
          fi
      - name: Build
        env:
          PKG: ${{ matrix.pkg }}
        run: just build "$PKG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.pkg }}
          path: out/${{ matrix.pkg }}/
          if-no-files-found: error
